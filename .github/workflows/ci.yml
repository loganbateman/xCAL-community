name: Community checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pyflakes
      - run: python scripts/check_publication.py
      - run: python -m pyflakes src scripts
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/smoke_test_ui.py
      - run: python scripts/smoke_test_ui.py --recovery
